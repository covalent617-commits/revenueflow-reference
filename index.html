<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><title>RevenueFlow — Revenue Operations</title>
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#142238;--line:#26364d;--muted:#91a1b7;--text:#edf3fb;--amber:#f5b942;--green:#43c59e;--red:#ef7777;--blue:#70a9ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#0e192a;border-right:1px solid var(--line);padding:24px 15px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:0 10px 28px}.mark{width:34px;height:34px;border-radius:10px;background:var(--amber);color:#172033;display:grid;place-items:center;font-weight:900;font-size:18px}.brand b{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px}.group{color:#71839c;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;padding:15px 11px 7px}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:transparent;color:#aebbd0;text-align:left;border-radius:8px;margin:2px 0}.nav:hover,.nav.active{background:#1b2a40;color:#fff}.nav.active{box-shadow:inset 3px 0 var(--amber)}.nav i{width:18px;color:var(--amber);font-style:normal;text-align:center}.main{min-width:0}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#0d1727;position:sticky;top:0;z-index:2}.crumb{color:var(--muted)}.topright{display:flex;align-items:center;gap:14px}.pill{border:1px solid var(--line);padding:7px 11px;border-radius:8px;color:#bdc9d9;background:#101d30}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#263a55;color:var(--amber);font-weight:700}.content{max-width:1500px;margin:auto;padding:30px 34px 60px}.eyebrow{color:var(--amber);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.heading h1{font-size:27px;letter-spacing:-.7px;margin:4px 0}.sub{color:var(--muted);margin:0}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#17263b;color:var(--text);padding:9px 13px;border-radius:8px}.btn.primary{background:var(--amber);color:#1a2434;border-color:var(--amber);font-weight:700}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}.klabel{color:var(--muted);font-size:12px}.value{font-size:27px;font-weight:700;letter-spacing:-.8px;margin:8px 0 2px}.delta{font-size:11px;color:var(--green)}.muted{color:var(--muted)}.two{grid-template-columns:1.4fr 1fr;margin-bottom:16px}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:15px;margin:0 0 16px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.chart{height:190px;display:flex;align-items:end;gap:12px;padding:15px 6px 0;border-bottom:1px solid var(--line)}.barwrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px}.bar{width:65%;min-height:5px;border-radius:5px 5px 0 0;background:linear-gradient(0deg,#b77b1e,var(--amber))}.barwrap small{color:var(--muted);font-size:10px}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-top:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:5px}.rows{display:grid;gap:14px}.rowline{display:flex;justify-content:space-between;gap:10px;font-size:12px}.track{height:6px;background:#24354b;border-radius:9px;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--amber);border-radius:9px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #24344a;font-size:12px}th{color:#8294ab;font-weight:600}td{color:#d8e1ed}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#26364b;color:#b9c8db;font-size:10px}.badge.amber{background:#49391f;color:#ffd27a}.badge.green{background:#173e37;color:#77dfbd}.badge.red{background:#472a32;color:#ff9a9a}.pagegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.report{padding:18px;min-height:120px}.report b{display:block;margin:8px 0}.report p{margin:0;color:var(--muted);font-size:12px}.notice{padding:12px 14px;border:1px solid #574526;background:#2a2418;border-radius:9px;color:#e9c987;font-size:12px;margin-bottom:16px}.search{background:#101d30;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);width:220px}.hidden{display:none}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pagegrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;padding:12px;display:flex;overflow:auto;gap:5px;border-right:0;border-bottom:1px solid var(--line)}.brand,.group{display:none}.nav{white-space:nowrap;width:auto;padding:9px}.top{padding:0 16px;height:58px}.content{padding:22px 15px}.heading{display:block}.actions{margin-top:15px}.kpis{gap:9px}.card{padding:14px}.value{font-size:22px}.pagegrid{grid-template-columns:1fr}.search{width:100%}}
</style></head>
<body><div class="shell">
<aside class="side"><div class="brand"><div class="mark">R</div><div><b>RevenueFlow</b><small>Revenue operations</small></div></div>
<div class="group">Workspace</div>
<button class="nav active" data-page="dashboard"><i>◫</i>Dashboard</button>
<button class="nav" data-page="opportunities"><i>◇</i>Opportunities</button><button class="nav" data-page="customers"><i>◎</i>Customers</button><button class="nav" data-page="quotes"><i>▤</i>Quotes</button><button class="nav" data-page="tasks"><i>✓</i>Tasks</button><button class="nav" data-page="attention"><i>◉</i>Attention</button>
<div class="group">Intelligence</div><button class="nav" data-page="forecast"><i>⌁</i>Forecast</button><button class="nav" data-page="analytics"><i>▥</i>Analytics</button><button class="nav" data-page="leak"><i>⌖</i>Leak Radar</button>
<div class="group">Manage</div><button class="nav" data-page="activity"><i>↗</i>Activity</button><button class="nav" data-page="records"><i>▦</i>Records</button><button class="nav" data-page="team"><i>♙</i>Team</button><button class="nav" data-page="notifications"><i>♢</i>Notifications</button><button class="nav" data-page="settings"><i>⚙</i>Settings</button></aside>
<main class="main"><header class="top"><span class="crumb">Workspace / <b id="crumb">Dashboard</b></span><div class="topright"><span class="pill">Demo workspace</span><span class="avatar">RF</span></div></header><div class="content" id="content"></div></main></div>
<script>
const names={dashboard:"Dashboard",opportunities:"Opportunities",customers:"Customers",quotes:"Quotes",tasks:"Tasks",attention:"Attention",forecast:"Forecast",analytics:"Analytics",leak:"Leak Radar",activity:"Activity",records:"Records",team:"Team",notifications:"Notifications",settings:"Settings"};
const sample=[["Northstar Digital","Website redesign","£18,500","Proposal","amber"],["Vertex Consulting","Operations platform","£32,000","Negotiation","green"],["Apex Services","Support retainer","£9,600","Qualified","amber"],["Brightline Studio","CRM implementation","£14,200","At risk","red"]];
const kpi=(label,value,delta="Illustrative demo data")=>'<div class="card"><div class="klabel">'+label+'</div><div class="value">'+value+'</div><div class="delta">'+delta+'</div></div>';
const table=(heads,rows)=>'<div class="card tablewrap"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const bars=(title,labels,values)=>'<div class="card"><div class="cardhead"><h2>'+title+'</h2><span class="muted">Last 6 periods</span></div><div class="chart">'+values.map((v,i)=>'<div class="barwrap"><div class="bar" style="height:'+v+'%"></div><small>'+labels[i]+'</small></div>').join('')+'</div><div class="legend"><span><i class="dot"></i>Illustrative value</span></div></div>';
const notice='<div class="notice">Reference prototype · All figures and records are illustrative, not live RevenueFlow customer data.</div>';
function dashboard(){return '<div class="heading"><div><div class="eyebrow">Revenue command centre</div><h1>Good morning</h1><p class="sub">A clear view of revenue, momentum and what needs attention.</p></div><div class="actions"><button class="btn">Last 30 days⌄</button><button class="btn primary" onclick="alert(\'Demo action: create opportunity\')">＋ New opportunity</button></div></div>'+notice+'<div class="grid kpis">'+kpi("Won revenue","£84,250","+12.4% vs prior period")+kpi("Open pipeline","£246,800","18 active opportunities")+kpi("Weighted forecast","£132,400","Based on stage weights")+kpi("At-risk pipeline","£38,600","4 opportunities flagged")+kpi("Win rate","32.0%","Won ÷ decided opportunities")+kpi("Average won deal","£12,035","Won revenue ÷ won deals")+kpi("Follow-up completion","78%","Completed eligible follow-ups")+kpi("Quote acceptance","46%","Accepted ÷ decided quotes")+'</div><div class="grid two">'+bars("Revenue performance",["May","Jun","Jul","Aug","Sep","Oct"],[38,52,45,68,61,86])+'<div class="card"><h2>Pipeline by stage</h2><div class="rows">'+[['New',18,25],['Qualified',48,62],['Proposal',72,84],['Negotiation',56,55],['Won',86,92]].map(x=>'<div><div class="rowline"><span>'+x[0]+'</span><b>'+x[1]+' deals</b></div><div class="track"><div class="fill" style="width:'+x[2]+'%"></div></div></div>').join('')+'</div></div></div><div class="grid two"><div class="card"><h2>Needs attention</h2><div class="rows"><div class="rowline"><span>4 opportunities have no next action</span><span class="badge red">High</span></div><div class="rowline"><span>3 quotes awaiting a response</span><span class="badge amber">Medium</span></div><div class="rowline"><span>5 follow-ups due today</span><span class="badge amber">Medium</span></div></div></div><div class="card"><h2>Next actions</h2><div class="rows"><div class="rowline"><span>Follow up with Northstar Digital</span><span class="muted">Today</span></div><div class="rowline"><span>Review Vertex proposal</span><span class="muted">Tomorrow</span></div><div class="rowline"><span>Prepare Apex renewal quote</span><span class="muted">Fri</span></div></div></div></div><div class="card"><h2>Recent opportunities</h2>'+table(["Customer","Opportunity","Value","Stage"],sample.map(x=>[x[0],x[1],x[2],'<span class="badge '+x[4]+'">'+x[3]+'</span>']))+'</div>'}
function generic(page){const data={
opportunities:["Manage your pipeline from first conversation to outcome.","Open pipeline","£246,800","18 active","At risk","£38,600","4 flagged",["Customer","Opportunity","Value","Stage"],sample.map(x=>[x[0],x[1],x[2],'<span class="badge '+x[4]+'">'+x[3]+'</span>'])],
customers:["Understand every relationship and its revenue contribution.","Total customers","126","Active customers","98","Won revenue","£84,250",["Customer","Type","Open deals","Won revenue"],[["Northstar Digital","Company","3","£18,500"],["Vertex Consulting","Company","2","£32,000"],["Apex Services","Company","1","£9,600"]]],
quotes:["Track proposals, decisions and response momentum.","Quotes sent","42","Accepted","19","Awaiting response","11",["Customer","Quote","Value","Status"],[["Northstar Digital","Website redesign","£18,500","Sent"],["Vertex Consulting","Platform build","£32,000","Accepted"],["Apex Services","Support retainer","£9,600","Awaiting response"]]],
tasks:["Keep every deal moving with clear ownership and due dates.","Open tasks","34","Completed","118","Overdue","6",["Task","Related record","Owner","Due"],[["Send revised proposal","Northstar Digital","Alex","Today"],["Schedule discovery","Apex Services","Jordan","Tomorrow"]]],
attention:["Prioritised signals with evidence and recommended next steps.","High priority","4","Medium priority","7","Pipeline exposed","£38,600",["Signal","Evidence","Record","Priority"],[["No next action","No future task scheduled","Northstar Digital",'<span class="badge red">High</span>'],["Quote awaiting reply","No response in 8 days","Apex Services",'<span class="badge amber">Medium</span>']]],
forecast:["Separate booked revenue from weighted expectations.","Won revenue","£84,250","Weighted forecast","£132,400","Open pipeline","£246,800",["Forecast component","Value","Interpretation"],[["Actual won","£84,250","Closed-won records"],["Weighted expected","£132,400","Open deals × stage weights"],["Open pipeline","£246,800","Unweighted open value"]]],
leak:["Find observable risks before opportunities lose momentum.","At-risk pipeline","£38,600","Flagged deals","4","High severity","2",["Risk signal","Evidence","Opportunity","Exposure"],[["No next action","No future task scheduled","Northstar Digital","£18,500"],["Stale opportunity","No activity in 21 days","Apex Services","£9,600"]]],
activity:["A chronological record of meaningful customer and deal events.","Events this month","214","Team updates","68","Customer touchpoints","146",["Event","Related record","Owner","When"],[["Quote sent","Northstar Digital","Alex","Today"],["Stage changed to Negotiation","Vertex Consulting","Jordan","Yesterday"]]],
records:["Search, review and export your business records.","Customers","126","Opportunities","54","Quotes","42",["Record type","Total","Available action"],[["Customers","126","View / export"],["Opportunities","54","View / export"],["Quotes","42","View / export"]]],
team:["See ownership, workload and contribution across the team.","Team members","8","Open tasks","34","Won revenue","£84,250",["Member","Open deals","Tasks","Won revenue"],[["Alex Morgan","12","9","£31,200"],["Jordan Lee","8","7","£28,500"],["Sam Taylor","6","5","£24,550"]]],
notifications:["Stay informed about important business events.","Unread","7","High priority","2","All notifications","24",["Notification","Related record","Priority","Status"],[["Opportunity moved to Won","Vertex Consulting",'<span class="badge green">Success</span>','Unread'],["Quote response overdue","Apex Services",'<span class="badge amber">Medium</span>','Unread']]],
settings:["Manage organization preferences and account controls.","Organization","Demo workspace","Currency","GBP","Timezone","UTC+1",["Setting","Description"],[["Organization profile","Name and business details"],["Team and roles","Membership and access"],["Notifications","Event preferences"],["Data controls","Export and archive policies"]]]
}[page];return '<div class="heading"><div><div class="eyebrow">RevenueFlow workspace</div><h1>'+names[page]+'</h1><p class="sub">'+data[0]+'</p></div><div class="actions"><button class="btn">Filters⌄</button><button class="btn primary" onclick="alert(\'Prototype action — not connected to a backend\')">＋ Create</button></div></div>'+notice+'<div class="grid kpis">'+kpi(data[1],data[2])+kpi(data[3],data[4])+kpi(data[5],data[6])+kpi("Workspace health","On track")+'</div>'+table(data[7],data[8])}
function analytics(){const reports=["Revenue Intelligence","Pipeline Performance","Win/Loss Analysis","Follow-up Performance","Leak Radar Intelligence","Customer Intelligence","Quote Performance","Team Performance","Forecast Analysis"];return '<div class="heading"><div><div class="eyebrow">Business intelligence</div><h1>Analytics</h1><p class="sub">Explore performance across the complete revenue lifecycle.</p></div><button class="btn">Last 90 days⌄</button></div>'+notice+'<div class="grid pagegrid">'+reports.map((x,i)=>'<div class="card report"><span class="eyebrow">Report 0'+(i+1)+'</span><b>'+x+'</b><p>Explore trends, segments, definitions and contributing records.</p></div>').join('')+'</div><div class="grid two" style="margin-top:16px">'+bars("Revenue trend",["May","Jun","Jul","Aug","Sep","Oct"],[35,48,44,65,73,88])+bars("Pipeline movement",["May","Jun","Jul","Aug","Sep","Oct"],[45,52,39,70,62,81])+'</div>'}
function render(page){document.getElementById("crumb").textContent=names[page];document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=page==="dashboard"?dashboard():page==="analytics"?analytics():generic(page);history.replaceState(null,"","#"+page)}
document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>render(b.dataset.page)));render(location.hash.slice(1) in names?location.hash.slice(1):"dashboard");
</script></body></html>
