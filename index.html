ass="grid two" style="margin-top:14px">'+chartFrame("Forecast composition","Actual vs expected vs unweighted",bars("Revenue components",["Won revenue","Weighted forecast","Open pipeline"],[28,13,86],["#27c69a","#f3b642","#59a8f5"]))+chartFrame("Forecast by stage","Illustrative weighted contribution",bars("Stage weighting",["Qualification","Proposal","Negotiation"],[25,65,75],["#59a8f5","#f3b642","#f28a47"]))+'</div>':"")}
function notificationsPage(){return '<div class="heading"><div><div class="eyebrow">Activity centre</div><h1>Notifications</h1><p class="sub">Business events and action-required alerts, in one place.</p></div><div class="actions"><button class="btn" data-action="mark-read">Mark all read</button><button class="btn" data-action="bulk-delete">Delete selected</button></div></div>'+notice()+'<div class="toolbar"><select class="select" id="nread"><option>All messages</option><option>Unread</option><option>Read</option></select><select class="select" id="ntype"><option>All event types</option><option>Opportunity</option><option>Quote</option><option>Task</option><option>Customer</option></select><select class="select"><option>All priorities</option><option>Critical</option><option>High</option><option>Medium</option><option>Info</option></select><input class="field" placeholder="Search notifications…"></div><section class="card" id="notificationlist">'+notifications.map((n,i)=>'<div class="notification '+(n[4]?"unread":"")+'" data-notification="'+i+'"><input type="checkbox" aria-label="Select notification"><span class="nicon">'+(i===0?"✓":i===1?"▤":i===2?"!":"◷")+'</span><div style="flex:1"><strong>'+n[0]+'</strong><p>'+n[1]+' · '+n[3]+'</p></div><span class="status '+(n[2]==="Success"?"low":n[2]==="High"?"high":n[2]==="Medium"?"medium":"info")+'">'+n[2]+'</span><button class="btn" data-action="read-one" data-index="'+i+'">'+(n[4]?"Mark read":"Read")+'</button></div>').join("")+'</section><p class="tiny" style="margin-top:10px">When an opportunity changes to Won or Lost, its current status notification is superseded. The underlying business-event history is preserved. Bulk deletion requires confirmation.</p>'}
function pageContent(p){if(p==="dashboard")return dashboard();if(p==="leak")return leak();if(p==="analytics")return analytics();if(p==="customers")return customersPage();if(p==="notifications")return notificationsPage();return genericPage(p)}
function render(p,pulse=true){if(!navNames[p])p="dashboard";current=p;document.querySelectorAll(".navbtn").forEach(b=>{b.classList.toggle("active",b.dataset.page===p);b.classList.remove("pulse")});let active=document.querySelector('.navbtn[data-page="'+p+'"]');if(active&&pulse){void active.offsetWidth;active.classList.add("pulse")}document.getElementById("content").innerHTML=pageContent(p);history.replaceState(null,"","#"+p);window.scrollTo({top:0,behavior:"smooth"})}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function openModal(html){document.getElementById("modalbody").innerHTML=html;document.getElementById("modal").classList.add("open")}
function opportunityDetail(o){let c=customers.find(x=>x.name===o.customer);openModal('<div class="modalhead"><div><div class="eyebrow">Opportunity · '+o.stage+'</div><h2>'+o.name+'</h2></div><button class="btn" data-action="close">✕</button></div><p class="sub">A single commercial record connected to its customer, quote, tasks and activity history.</p><div class="detailgrid">'+[["Customer",o.customer],["Pipeline value",money(o.value)],["Stage",o.stage],["Stage probability",o.prob+"%"],["Risk score",o.score+" · evidence signal"],["Main risk signal",o.risk],["Owner",o.owner],["Expected close",o.close],["Last activity",o.last],["Days at risk",o.days]].map(x=>'<div class="detailfield"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join("")+'</div><h3>Connected workflow</h3><div class="flow"><span>Customer</span><em>→</em><span>Opportunity</span><em>→</em><span>Task / activity</span><em>→</em><span>Quote</span><em>→</em><span>Won / Lost</span></div><h3>Next action</h3><p class="sub">'+(c?c.next:"Review next customer action")+'</p><h3>Business history</h3><div class="actionslist"><div class="actionrow">Opportunity created <span class="muted">· 24 days ago</span></div><div class="actionrow">Stage changed to '+o.stage+' <span class="muted">· 8 days ago</span></div><div class="actionrow">Risk signal observed: '+o.risk+' <span class="muted">· '+o.last+'</span></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" data-action="new-task">＋ Create follow-up task</button><button class="btn" data-action="related-customer">Open customer</button></div>')}
function createForm(kind){let fields=kind==="new-customer"?'<label>Customer type<select class="field" id="f-type"><option>Company</option><option>Individual</option></select></label><label>Customer name<input class="field" id="f-name" required></label><label>Primary contact<input class="field" id="f-contact"></label><label>Email<input class="field" id="f-email" type="email"></label><label>Industry<input class="field" id="f-industry"></label>':kind==="new-opportunity"?'<label>Opportunity name<input class="field" id="f-name" required></label><label>Customer<select class="field" id="f-customer">'+customers.map(c=>'<option>'+c.name+'</option>').join("")+'</select></label><label>Value (£)<input class="field" id="f-value" type="number" min="0" required></label><label>Stage<select class="field" id="f-stage"><option>Prospecting</option><option>Qualification</option><option>Proposal</option><option>Negotiation</option></select></label>':'<label>Name<input class="field" id="f-name" required></label><label>Related customer<select class="field" id="f-customer">'+customers.map(c=>'<option>'+c.name+'</option>').join("")+'</select></label><label>Due date<input class="field" id="f-date" type="date"></label>';openModal('<div class="modalhead"><h2>'+kind.replace("new-","New ").replace("-"," ")+'</h2><button class="btn" data-action="close">✕</button></div><form id="createform" class="grid" style="gap:12px">'+fields+'<button class="btn primary" type="submit">Save demo record</button><p class="tiny">Prototype only. This does not write to the RevenueFlow database.</p></form>')}
document.addEventListener("click",e=>{let nav=e.target.closest("[data-page]");if(nav){render(nav.dataset.page);return}let tab=e.target.closest("[data-tab]");if(tab){activeReport=Number(tab.dataset.tab);render("analytics",false);return}let cust=e.target.closest("[data-customer]");if(cust){let c=customers[Number(cust.dataset.customer)];openModal(customerDetail(c));return}let act=e.target.closest("[data-action]");if(act){let a=act.dataset.action;if(a==="close"){document.getElementById("modal").classList.remove("open");return}if(a==="export"){toast("Demo CSV export prepared · illustrative data only");return}if(a.startsWith("new-")){createForm(a);return}if(a==="bulk-delete"){if(confirm("Delete the selected demo notifications? This action cannot be undone."))toast("Selected demo notifications deleted");return}if(a==="mark-read"){toast("All demo notifications marked as read");return}if(a==="read-one"){let i=Number(act.dataset.index);notifications[i][4]=false;render("notifications",false);toast("Notification marked as read");return}if(a==="related-customer"){document.getElementById("modal").classList.remove("open");render("customers");return}if(a==="chart-filter"||a==="chart-point"||a==="bar-filter"){toast("Filtered view: "+(act.dataset.label||"selected period"));return}if(a==="open-related"){toast("Related record opened in this prototype");return}toast("Demo action: "+a.replaceAll("-"," "));return}let row=e.target.closest("tbody tr");if(row){let idx=Number(row.dataset.row);let o=opps[idx]||opps[0];if(current==="customers")return;if(current==="opportunities"||current==="leak"||current==="attention"||current==="dashboard")opportunityDetail(o);else toast("Record detail selected");}});
document.addEventListener("submit",e=>{if(e.target.id!=="createform")return;e.preventDefault();let name=document.getElementById("f-name").value.trim();if(!name){toast("Enter a name first");return}if(e.target.querySelector("#f-type")){customers.unshift({name,type:document.getElementById("f-type").value,contact:document.getElementById("f-contact").value||name,email:document.getElementById("f-email").value,industry:document.getElementById("f-industry").value,open:0,won:"£0",health:"Healthy",last:"Just now",next:"Add first opportunity",value:"£0",owner:"Sarah Mitchell"});document.getElementById("modal").classList.remove("open");render("customers");toast("Demo customer added")}else{toast("Demo record saved in this page session");document.getElementById("modal").classList.remove("open")}});
document.addEventListener("input",e=>{if(e.target.id==="custsearch"||e.target.id==="custtype"||e.target.id==="custhealth"){let q=(document.getElementById("custsearch").value||"").toLowerCase(),type=document.getElementById("custtype").value,health=document.getElementById("custhealth").value;document.querySelectorAll(".customer").forEach(el=>{let c=customers[Number(el.dataset.customer)];el.style.display=(c.name.toLowerCase().includes(q)||c.contact.toLowerCase().includes(q)||c.email.toLowerCase().includes(q))&&(type==="All types"||c.type===type)&&(health==="All health statuses"||c.health===health)?"":"none"})}});
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){let q=e.target.value.toLowerCase();let c=customers.find(x=>x.name.toLowerCase().includes(q));let o=opps.find(x=>x.name.toLowerCase().includes(q));if(c){render("customers");let i=customers.indexOf(c);openModal(customerDetail(c))}else if(o)opportunityDetail(o);else toast("No matching demo record found")}});
