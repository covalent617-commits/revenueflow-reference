function rfEsc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rfTable(head,rows,click=true){return '<div class="card tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr '+(click?'class="clickable" data-row="'+i+'"':'')+'>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function rfTabs(items,active){return '<div class="tabs">'+items.map((x,i)=>'<button class="tab '+(x===active?'active':'')+'" data-tab="'+rfEsc(x)+'">'+x+'</button>').join('')+'</div>'}
function rfLeak(){return '<div class="heading"><div><div class="eyebrow">Revenue protection / intelligence</div><h1>Leak Radar</h1><p class="sub">Identify risks early. Protect your pipeline. Close more deals.</p></div><div class="actions"><button class="btn" data-action="date">▣ Apr 1, 2025 – Apr 30, 2025⌄</button><button class="btn" data-action="period">Last 30 days⌄</button></div></div>'+notice+'<div class="grid kpis">'+kpi("Total at-risk opportunities","12",'<span style="color:var(--red)">↑ 3</span> vs previous period')+kpi("At-risk pipeline value","£1,248,000",'<span style="color:var(--red)">↑ 12%</span>')+kpi("New risks (30 days)","7",'<span style="color:var(--red)">↑ 4</span>')+kpi("Resolved risks","5",'<span style="color:var(--green)">↑ 2</span>')+kpi("Avg. time to resolve","3.2 days",'<span style="color:var(--green)">↓ 1.8 days</span>')+'</div><div class="grid leak-layout" style="margin-bottom:15px"><div class="card"><div class="cardhead"><h2>Risk Trend</h2><span class="muted">● Total risks　● New risks　● Resolved</span></div>'+rfLineChart()+'</div><div class="card"><h2>Risk Levels</h2><div class="donut-row"><div class="donut"><strong>12<small>At-risk</small></strong></div><div class="legend-list"><span><label><i style="background:#f16b73"></i>Critical</label><b>3 (25%)</b></span><span><label><i style="background:#f18b45"></i>High</label><b>5 (42%)</b></span><span><label><i style="background:#f4c34d"></i>Medium</label><b>3 (25%)</b></span><span><label><i style="background:#25c99a"></i>Low</label><b>1 (8%)</b></span></div></div></div><div class="card"><div class="cardhead"><h2>Top Risk Signals ⓘ</h2><button class="btn" data-page="attention">View all →</button></div><div class="rows">'+[['No recent activity',5,'42%','critical'],['Closing date moved',3,'25%','high'],['Low engagement',2,'17%','medium'],['Competitor mentioned',1,'8%','info'],['Budget uncertainty',1,'8%','medium']].map(x=>'<div class="rowline signal"><span class="signal-icon">'+(x[3]==='critical'?'◉':'!')+'</span><span style="flex:1">'+x[0]+'</span><b>'+x[1]+'</b><span class="muted">'+x[2]+'</span></div>').join('')+'</div></div><div class="card wide-risk"><div class="cardhead"><h2>At-Risk Opportunities</h2><button class="btn" data-action="export">Export</button></div>'+rfTable(["Opportunity","Customer","Risk score","Main risk signal","Pipeline value","Days at risk","Actions"],RF_OPPS.map(x=>[x[0],x[1],'<span class="status '+(Number(x[4])>80?'critical':Number(x[4])>65?'high':'medium')+'">'+x[4]+'</span>',x[5],x[2],x[4]==='92'?'12':'5','<button class="btn" data-detail="'+rfEsc(x[0])+'">View →</button>']))+'</div><div class="card"><h2>Recommended Actions</h2><div class="action-list">'+RF_OPPS.map((x,i)=>'<div class="action-item"><div class="action-symbol">↗</div><div><b>'+(["Contact Global Tech Solutions (priority)","Review closing date for Westlake Industries","Send value proposal to Summit Retail Group","Confirm budget with Riverside Healthcare","Prepare renewal strategy for BrightEdge Financial"][i])+'</b><p>'+x[5]+' · '+x[1]+'</p></div><button class="btn" data-detail="'+rfEsc(x[0])+'">Open →</button></div>').join('')+'</div></div></div>'}
function rfLineChart(){return '<svg class="chart-svg" viewBox="0 0 600 220" preserveAspectRatio="none"><g>'+[25,65,105,145,185].map(y=>'<line class="gridline" x1="36" x2="590" y1="'+y+'" y2="'+y+'"/>').join('')+'</g><g>'+['20','15','10','5','0'].map((v,i)=>'<text x="3" y="'+(29+i*40)+'">'+v+'</text>').join('')+'</g><polyline class="line-a" points="36,150 75,140 114,110 153,125 192,112 231,102 270,115 309,90 348,108 387,125 426,110 465,118 504,90 543,70 590,62"/><polyline class="line-b" points="36,170 75,175 114,155 153,168 192,160 231,148 270,166 309,150 348,162 387,175 426,158 465,165 504,143 543,138 590,126"/><polyline class="line-c" points="36,190 75,184 114,180 153,188 192,179 231,182 270,175 309,185 348,178 387,190 426,180 465,185 504,171 543,168 590,160"/>'+['Apr 1','Apr 5','Apr 10','Apr 15','Apr 20','Apr 25','Apr 30'].map((v,i)=>'<text x="'+(36+i*90)+'" y="213">'+v+'</text>').join('')+'</svg>'}
function rfCustomers(){return '<div class="heading"><div><div class="eyebrow">Relationships</div><h1>Customers</h1><p class="sub">A complete view of the people and companies behind your revenue.</p></div><button class="btn primary" data-action="new-customer">＋ New customer</button></div>'+notice+'<div class="flow"><span>Customer</span><em>→</em><span>Opportunity</span><em>→</em><span>Activity & tasks</span><em>→</em><span>Quote</span><em>→</em><span>Outcome & revenue</span></div><div class="grid kpis">'+kpi("Total customers","126")+kpi("Companies","104")+kpi("Individuals","22")+kpi("Customers with open deals","38")+kpi("Won customer revenue","£741,200")+'</div><div class="toolbar"><input id="customer-search" placeholder="Search customers or contacts…"><select id="customer-type"><option>All types</option><option>Company</option><option>Individual</option></select><select id="customer-health"><option>All health statuses</option><option>Healthy</option><option>Watch</option><option>Needs attention</option></select><button class="btn" data-action="export">Export CSV</button></div><div class="grid report-cards" id="customer-cards">'+RF_CUSTOMERS.map((c,i)=>'<div class="card report-card customer-card" data-customer="'+i+'"><div class="cardhead"><span class="badge">'+c.type+'</span><span class="status '+(c.health==='Healthy'?'low':c.health==='Watch'?'medium':'high')+'">'+c.health+'</span></div><b>'+c.name+'</b><p>'+c.contact+' · '+c.industry+'</p><div class="rowline"><span class="muted">'+c.open+' open opportunities</span><b>'+c.won+'</b></div><div class="metric-note">Last activity: '+c.last+'</div><div class="metric-note">Next action: '+c.next+'</div></div>').join('')+'</div>'}
function rfAnalytics(){return '<div class="heading"><div><div class="eyebrow">Business intelligence</div><h1>Analytics</h1><p class="sub">Deep insight. Better decisions. More revenue.</p></div><div class="actions"><button class="btn">▣ Apr 1, 2025 – Apr 30, 2025⌄</button><button class="btn">Compare to Previous Period⌄</button><button class="btn" data-action="export">⇩ Export</button></div></div>'+notice+rfTabs(RF_REPORTS.map(x=>x[0]),"Revenue Intelligence")+'<div class="grid kpis">'+kpi("Won revenue","£2,845,000","↑ 18% vs previous period")+kpi("Revenue growth","18%","↑ 12%")+kpi("Average deal value","£142,250","↑ 7%")+kpi("Total opportunities won","26","↑ 30%")+kpi("Win rate","32.5%","↑ 6.2%")+'</div><div class="grid three">'+bars("Revenue over time",["Apr 1","Apr 7","Apr 14","Apr 21","Apr 28"],[35,48,62,58,83])+bars("Pipeline by stage",["Prospect","Qualify","Proposal","Negotiate","Won"],[72,58,45,38,24])+bars("Won vs Lost",["Apr 1","Apr 8","Apr 15","Apr 22","Apr 29"],[55,62,48,72,65])+'</div><div class="grid two" style="margin-top:15px">'+bars("Revenue by owner",["Sarah","James","Priya","Daniel","Emma"],[88,72,61,54,42])+bars("Revenue comparison",["Jan","Feb","Mar","Apr","May","Jun"],[30,38,45,52,68,81])+'<div class="card"><h2>Quick Insights</h2><div class="action-list"><div class="action-item">Revenue increased by 18% compared with the previous period.</div><div class="action-item">Win rate improved by 6.2 percentage points.</div><div class="action-item">Proposal stage has the highest open pipeline value.</div></div></div><div class="card"><h2>Recent Activity</h2><div class="action-list"><div class="action-item">🟢 Opportunity won · Global Tech Solutions</div><div class="action-item">🟡 Task completed · Follow-up call</div><div class="action-item">🔵 Quote approved · BrightEdge Financial</div></div></div></div>'}
function rfGeneric(page){let title=names[page]||"Workspace";let rows=RF_OPPS.map(x=>[x[0],x[1],x[2],x[3],'<button class="btn" data-detail="'+rfEsc(x[0])+'">View →</button>']);let configs={opportunities:["Manage opportunities from first conversation to outcome.",["Opportunity","Customer","Value","Stage","Record"],rows],quotes:["Create, send and track commercial proposals.",["Quote","Customer","Value","Status","Record"],[["Website redesign","Global Tech Solutions","£18,500","Sent","View →"],["Cloud migration","Westlake Industries","£28,000","Accepted","View →"],["Annual support","Summit Retail Group","£12,500","Awaiting response","View →"]]],tasks:["Keep every commitment owned, scheduled and completed.",["Task","Customer / opportunity","Owner","Due","Status"],[["Discovery follow-up","Global Tech Solutions","Sarah","Today","Open"],["Review proposal","Westlake Industries","James","Tomorrow","Open"],["Renewal call","BrightEdge Financial","Priya","Yesterday","Overdue"]]],attention:["Prioritised actions, with evidence explaining why each surfaced.",["Signal","Affected opportunity","Evidence","Priority","Action"],RF_OPPS.map(x=>[x[5],x[0],"Observed record activity",'<span class="status high">High</span>','<button class="btn" data-detail="'+rfEsc(x[0])+'">Review</button>'])],forecast:["Keep actual results distinct from expected outcomes.",["Component","Value","Definition"],[["Won revenue","£84,250","Closed-won opportunities"],["Weighted forecast","£132,400","Open value × stage probability"],["Open pipeline","£246,800","Unweighted open opportunity value"]]],activity:["A chronological feed of customer and revenue events.",["Event","Customer","Owner","When"],[["Opportunity moved to Proposal","Global Tech Solutions","Sarah","Today"],["Quote sent","Westlake Industries","James","Yesterday"]]],records:["Search, inspect, export and safely manage business records.",["Record type","Records","Policy"],[["Customers","126","Archive where dependencies exist"],["Opportunities","54","Preserve outcome history"],["Quotes","42","Keep commercial audit trail"],["Tasks","318","Retain completion history"]]],team:["Understand ownership, contribution and workload.",["Team member","Open deals","Tasks","Won revenue"],[["Sarah Mitchell","12","9","£820K"],["James Carter","8","7","£590K"],["Priya Nair","6","5","£540K"],["Daniel Brooks","5","6","£410K"]]],notifications:["Business events and action-required alerts in one place.",["Notification","Related record","Priority","Status"],[["Opportunity won","Global Tech Solutions",'<span class="status low">Success</span>','Unread'],["Quote awaiting response","Westlake Industries",'<span class="status medium">Medium</span>','Unread'],["Follow-up overdue","Summit Retail Group",'<span class="status high">High</span>','Read']]],settings:["Organization preferences, access and data controls.",["Setting","Current configuration","Action"],[["Organization profile","RevenueFlow Demo","Manage"],["Currency","GBP","Change"],["Timezone","Africa/Lagos","Change"],["Team & roles","Role-based access","Manage"],["Notifications","Event preferences","Configure"],["Data controls","Archive and export","Review"]] ]};let cfg=configs[page]||configs.opportunities;return '<div class="heading"><div><div class="eyebrow">RevenueFlow workspace</div><h1>'+title+'</h1><p class="sub">'+cfg[0]+'</p></div><button class="btn primary" data-action="create">＋ Create new</button></div>'+notice+'<div class="grid kpis">'+kpi("Total records","126")+kpi("Open / active","38")+kpi("Needs attention","7")+kpi("Updated this period","24")+'</div><div class="toolbar"><input placeholder="Search '+title.toLowerCase()+'…"><select><option>All statuses</option><option>Open</option><option>Completed</option><option>Archived</option></select><button class="btn" data-action="export">Export CSV</button></div>'+rfTable(cfg[1],cfg[2])}
function rfDetail(title){let opp=RF_OPPS.find(x=>x[0]===title);let c=RF_CUSTOMERS.find(x=>x.name===(opp?.[1]||title))||RF_CUSTOMERS[0];let body='<div class="modal-head"><div><div class="eyebrow">Record detail</div><h2>'+rfEsc(title)+'</h2></div><button class="modal-close" data-action="close">✕</button></div><p class="sub">Connected customer, opportunity, activity and next-action context.</p><div class="detail-grid"><div class="detail-field"><small>Customer</small><b>'+c.name+'</b></div><div class="detail-field"><small>Primary contact</small><b>'+c.contact+'</b></div><div class="detail-field"><small>Pipeline value</small><b>'+(opp?.[2]||c.value)+'</b></div><div class="detail-field"><small>Stage / health</small><b>'+(opp?.[3]||c.health)+'</b></div><div class="detail-field"><small>Main risk signal</small><b>'+(opp?.[5]||"No current signal")+'</b></div><div class="detail-field"><small>Next action</small><b>'+c.next+'</b></div></div><h2>Revenue workflow</h2><div class="flow"><span>Customer</span><em>→</em><span>Opportunity</span><em>→</em><span>Task / activity</span><em>→</em><span>Quote</span><em>→</em><span>Outcome</span></div><h2>Recent history</h2><div class="action-list"><div class="action-item">Customer record reviewed <span class="muted">Today</span></div><div class="action-item">Next action updated <span class="muted">Yesterday</span></div><div class="action-item">Opportunity activity recorded <span class="muted">3 days ago</span></div></div>';document.getElementById("rf-modal-content").innerHTML=body;document.getElementById("rf-modal").classList.add("open")}
function rfToast(msg){let t=document.getElementById("rf-toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
document.addEventListener("click",e=>{let p=e.target.closest("[data-page]");if(p){render(p.dataset.page);return}let d=e.target.closest("[data-detail]");if(d){rfDetail(d.dataset.detail);return}let c=e.target.closest("[data-customer]");if(c){rfDetail(RF_CUSTOMERS[Number(c.dataset.customer)].name);return}let tab=e.target.closest("[data-tab]");if(tab){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===tab));rfToast(tab.dataset.tab+" report selected");return}let a=e.target.closest("[data-action]");if(a){let act=a.dataset.action;if(act==="close"){document.getElementById("rf-modal").classList.remove("open")}else if(act==="export"){rfToast("Demo export prepared — illustrative data only")}else if(act==="new-customer"){rfDetail("New customer · create flow")}else if(act==="create"){rfToast("Demo create flow opened")}else rfToast("Demo control selected: "+act);return}});
document.addEventListener("input",e=>{if(e.target.id==="customer-search"||e.target.id==="customer-type"||e.target.id==="customer-health"){let q=(document.getElementById("customer-search").value||"").toLowerCase(),type=document.getElementById("customer-type").value,health=document.getElementById("customer-health").value;document.querySelectorAll("[data-customer]").forEach(el=>{let c=RF_CUSTOMERS[Number(el.dataset.customer)];el.style.display=(c.name.toLowerCase().includes(q)||c.contact.toLowerCase().includes(q))&&(type==="All types"||c.type===type)&&(health==="All health statuses"||c.health===health)?"":"none"})}});
const rfOldRender=render;
render=function(page){if(page==="leak"){document.getElementById("crumb").textContent="Leak Radar";document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=rfLeak();history.replaceState(null,"","#"+page)}else if(page==="customers"){document.getElementById("crumb").textContent="Customers";document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=rfCustomers();history.replaceState(null,"","#"+page)}else if(page==="analytics"){document.getElementById("crumb").textContent="Analytics";document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=rfAnalytics();history.replaceState(null,"","#"+page)}else if(page==="dashboard"||names[page]){document.getElementById("crumb").textContent=names[page];document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("content").innerHTML=page==="dashboard"?dashboard():rfGeneric(page);history.replaceState(null,"","#"+page)}};
document.body.insertAdjacentHTML("beforeend",'<div class="detail-modal" id="rf-modal"><div class="modal-card" id="rf-modal-content"></div></div><div class="toast" id="rf-toast"></div>');
render(location.hash.slice(1) in names?location.hash.slice(1):"dashboard");
</script>
